; Westfalen-Sued-Aktivitaet (WSA), rules valid from 2025/2026.
; Copy to ~/.config/llog/contests/wsa.ini and enter your own DOK.
[contest]
contest = WSA
; the exchange you send: your DOK, or NM if you have none
exchange_sent =
; your own DOK for the Cabrillo SPECIFIC header (required by WSA)
specific =
; SINGLE-OP, or MULTIOP for club stations
category_operator = SINGLE-OP

; every station once per band
dupe_check = band
dupe_ignore_suffix = no
dupe_exchange = no
dupe_minutes = 0

; FM 2, SSB 4, CW 6 points per QSO
points = FM:2, SSB:4, CW:6
; the O DOKs listed in the rules, VFDB DOKs and special DOKs,
; 1 multiplier each per band. Check the list against the current rules.
multipliers = O01, O02, O03, O04, O05, O06, O08, O09, O10, O11, O12,
    O14, O15, O16, O17, O18, O19, O22, O23, O25, O26, O27, O28, O29, O30,
    O32, O33, O34, O35, O36, O37, O38, O39, O41, O42, O43, O44, O45, O46,
    O47, O48, O49, O51, O52, O53, O54, O55,
    Z03, Z38, Z92, Z93, DVO, DWS, NOTO, YLO
mult_per = band
