; DARC CW-Ausbildungscontest (CWA), https://www.darc.de/index.php?id=57073
; 2nd Tuesday of March, June, September and December, 18:00-18:59 UTC,
; CW on 80 m, 12 to 22 WPM, up to 100 W.
; Copy to ~/.config/llog/contests/darc-cwa.ini and adjust the marked lines.
[contest]
; shown in llog's header and written as CONTEST: into the Cabrillo file.
; The rules name no Cabrillo contest name; if the log upload rejects CWA,
; try XMAS (the rules say programs for the DARC Weihnachtscontest can be used)
contest = CWA
; you send RST and your DOK (NM if you are not a DARC member)
exchange_sent =
; your DOK again, for the Cabrillo SPECIFIC header
specific =
category_operator = SINGLE-OP
category_band = 80M
category_mode = CW
category_power = LOW
; your locator, for the distance shown in the QSO list (may be empty)
locator =

; log every QSO as CW, whatever the radio reports
mode = CW

; CW message keys F1 to F10, as "label, text", for running (you call CQ) and
; for search and pounce (you answer a CQ). {MYCALL} is your callsign, {CALL}
; the callsign in the call field, {RST} the report (5NN), {EXCH} the exchange
; you send. A line with nothing after the = removes that key.
run_f1 = CQ, CQ TEST {MYCALL} {MYCALL} K
run_f2 = Exch, {RST} {EXCH}
run_f3 = TU, TU {MYCALL}
run_f4 = MyCall, {MYCALL}
run_f5 = HisCall, {CALL}
run_f6 = B4, {CALL} QSO B4
run_f7 = QRZ, {MYCALL} QRZ
run_f8 = Agn, AGN
run_f9 = Nr?, NR?
run_f10 = Call?, CL?

sp_f1 = QRL?, QRL? DE {MYCALL}
sp_f2 = Exch, TU {RST} {EXCH}
sp_f3 = TU, TU
sp_f4 = MyCall, {MYCALL}
sp_f5 = HisCall, {CALL}
sp_f6 = B4, QSO B4
sp_f7 =
sp_f8 = Agn, AGN
sp_f9 = Nr?, NR?
sp_f10 = Call?, CL?

; ESM: with "Enter sends message" on in the menu, Enter sends these keys:
;   running:           empty call field F1, callsign F5+F2, again F8,
;                      received exchange typed F3 and the QSO is logged
;   search and pounce: F4 until the received exchange is typed, then F2 and
;                      the QSO is logged
; key sent by Enter in an empty call field when running (f7 = QRZ)
esm_empty = f1
; Stations you have already worked (dupes):
;   yes = work them again like any other caller
;   no  = running: the first Enter sends F6 and no exchange; search and
;         pounce: the first Enter does not call. A second Enter works the
;         station anyway.
esm_work_dupes = yes
; fields that must be filled before Enter logs: exch, loc, both, or nothing
esm_required = exch
; run or sp: how llog starts
esm_start = run

; every station once
dupe_check = once
dupe_ignore_suffix = no
dupe_exchange = no
dupe_minutes = 0

; 1 point per QSO
points = *:1
; multipliers: every DOK once ...
multipliers = *
; ... but not NM, and not the serial numbers that non-DL stations send
mult_exclude = NM, #
; ... and every callsign prefix once (DL1, DK5, OK1, ...)
mult_prefix = yes
mult_per = contest
