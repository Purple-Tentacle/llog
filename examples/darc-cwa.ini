; DARC CW-Ausbildungscontest (CWA), https://www.darc.de/index.php?id=57073
; 2nd Tuesday of March, June, September and December, 18:00-18:59 UTC,
; CW on 80 m, 12 to 22 WPM, up to 100 W.
; Copy to ~/.config/llog/contests/darc-cwa.ini and adjust the marked lines.
[contest]
; shown in llog's header and written as CONTEST: into the Cabrillo file.
; The rules name no Cabrillo contest name; if the log upload rejects CWA,
; try XMAS (the rules say programs for the DARC Weihnachtscontest can be used)
contest = CWA
; you send RST and your DOK (NM if you are not a DARC member)
exchange_sent =
; your DOK again, for the Cabrillo SPECIFIC header
specific =
category_operator = SINGLE-OP
category_band = 80M
category_mode = CW
category_power = LOW
; your locator, for the distance shown in the QSO list (may be empty)
locator =

; log every QSO as CW, whatever the radio reports
mode = CW

; CW messages. {MYCALL} is your callsign, {CALL} the callsign in the call
; field, {EXCH} the exchange you send. An empty line switches a message off.
; F1: call CQ
cw_f1 = CQ TEST {MYCALL} {MYCALL} K

; ESM: with "Enter sends message" on in the menu, Enter runs the QSO in CW.
; Running (you called CQ), menu "Operating: Run":
;   empty call field
cw_enter = {MYCALL} QRZ
;   callsign typed: his call and your exchange
cw_call = {CALL} 5NN {EXCH}
;   Enter again while the received exchange is still missing
cw_again = AGN
;   received exchange typed: sent while the QSO is logged
cw_tu = TU {MYCALL}
; Search & pounce (you answer a CQ), menu "Operating: Search & pounce":
;   callsign typed, or empty call field: your call
cw_mycall = {MYCALL}
;   received exchange typed: your exchange, and the QSO is logged
cw_sp_exchange = TU 5NN {EXCH}
; Stations you have already worked (dupes):
;   yes = work them again like any other caller
;   no  = Run: the first Enter sends cw_dupe and no exchange; S&P: the first
;         Enter does not call. A second Enter works the station anyway.
esm_work_dupes = yes
cw_dupe = {CALL} QSO B4
; fields that must be filled before Enter logs: exch, loc, both, or nothing
esm_required = exch
; run or sp: how llog starts
esm_start = run

; every station once
dupe_check = once
dupe_ignore_suffix = no
dupe_exchange = no
dupe_minutes = 0

; 1 point per QSO
points = *:1
; multipliers: every DOK once ...
multipliers = *
; ... but not NM, and not the serial numbers that non-DL stations send
mult_exclude = NM, #
; ... and every callsign prefix once (DL1, DK5, OK1, ...)
mult_prefix = yes
mult_per = contest
