; DARC CW-Ausbildungscontest (CWA), https://www.darc.de/index.php?id=57073
; 2nd Tuesday of March, June, September and December, 18:00-18:59 UTC,
; CW on 80 m, 12 to 22 WPM, up to 100 W.
; Copy to ~/.config/llog/contests/darc-cwa.ini and adjust the marked lines.
[contest]
; the rules name no Cabrillo contest name; they say logging programs for the
; DARC Weihnachtscontest (XMAS) can be used, so that name is used here
contest = XMAS
; you send RST and your DOK (NM if you are not a DARC member)
exchange_sent =
; your DOK again, for the Cabrillo SPECIFIC header
specific =
category_operator = SINGLE-OP
category_band = 80M
category_mode = CW
category_power = LOW
; your locator, for the distance shown in the QSO list (may be empty)
locator =

; every station once
dupe_check = once
dupe_ignore_suffix = no
dupe_exchange = no
dupe_minutes = 0

; 1 point per QSO
points = *:1
; multipliers: every DOK once ...
multipliers = *
; ... but not NM, and not the serial numbers that non-DL stations send
mult_exclude = NM, #
; ... and every callsign prefix once (DL1, DK5, OK1, ...)
mult_prefix = yes
mult_per = contest
