; Westfalen-Nord-Aktivitaet (WNA), rules 2026.
; Copy to ~/.config/llog/contests/wna.ini and enter your own DOK.
[contest]
contest = WNA
; the exchange you send: your DOK (leave empty if you have none)
exchange_sent =
; your own DOK for the Cabrillo SPECIFIC header
specific =
category_operator = SINGLE-OP
; your locator, for the distance shown in the QSO list (may be empty)
locator =

; every station once per band
dupe_check = band
dupe_ignore_suffix = no
dupe_exchange = no
dupe_minutes = 0

; FM 2, SSB 4, CW 6 points per QSO
points = FM:2, SSB:4, CW:6
; every N DOK plus the listed special DOKs, 1 multiplier each per band
multipliers = N[0-9][0-9], WN, DVN, YLN, Z14, Z34, Z41, Z60, Z95
mult_per = band
