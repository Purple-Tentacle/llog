; CQ World-Wide DX Contest, CW (https://cqww.com), last full weekend of
; November, Saturday 00:00 UTC to Sunday 23:59 UTC, on 160/80/40/20/15/10 m.
; Copy to ~/.config/llog/contests/cq-ww-cw.ini and adjust the marked lines.
; Needs a country file: save cty.dat from www.country-files.com as
; ~/.config/llog/cty.dat
[contest]
; the Cabrillo name the organiser asks for (no year)
contest = CQ-WW-CW
; only when you use another callsign for this contest than in config.ini:
; call = OK/DA2IT
; you send RST and your CQ zone (Germany: 14) - adjust if you are elsewhere
exchange_sent = 14
; your locator, for the distance shown in the QSO list (may be empty)
locator =

; --- Cabrillo header ---
; DX for everyone outside the USA and Canada (there: state, province or
; ARRL section)
location = DX
; SINGLE-OP, MULTI-OP or CHECKLOG
category_operator = SINGLE-OP
; ASSISTED as soon as you use the DX cluster, POTA or SOTA spots or a CW
; decoder; NON-ASSISTED only without any of them. With NON-ASSISTED llog
; switches the cluster, all spot sources and the QRZ lookup off by itself for
; this contest.
category_assisted = ASSISTED
; ALL, or 160M / 80M / 40M / 20M / 15M / 10M for a single band entry
category_band = ALL
; HIGH (up to 1500 W), LOW (up to 100 W) or QRP (up to 5 W)
category_power = LOW
category_mode = CW
; CLASSIC, ROOKIE or YOUTH; leave empty otherwise (CLASSIC is not possible
; together with ASSISTED)
category_overlay =
; full club name for the club competition, or empty
club =

; log every QSO as CW
mode = CW

; every station counts once per band
dupe_check = band
dupe_ignore_suffix = no
dupe_exchange = no
dupe_minutes = 0

; fill the received exchange in: with the zone the station gave you on
; another band, or else with the usual CQ zone of its country (from the
; country file). Type over it when the station sends another zone - large
; countries have several.
exchange_prefill = log, zone

; QSO points by where the other station is:
;   other continent                  3 points
;   same continent, another country  1 point
;   own country                      0 points (still counts as multiplier)
; Stations in North America: set SAME:2 (2 points between different
; countries within North America).
points = DX:3, SAME:1, OWN:0
; multipliers on each band: every CQ zone (from the received exchange) ...
mult_zone = yes
; ... and every country (DXCC and WAE list, from the country file)
mult_country = yes
mult_per = band

; --- CW messages ---
; The default message keys fit this contest: F1 CQ, F2 "5NN 14", F3 TU,
; F4 your call. To change a text, add lines such as
;   run_f1 = CQ, CQ TEST {MYCALL} {MYCALL}
; (examples/darc-cwa.ini has the full list).
; the QSO is logged when the received zone is filled in
esm_required = exch
esm_work_dupes = yes
esm_start = run
