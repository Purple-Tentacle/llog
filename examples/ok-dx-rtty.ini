; OK DX RTTY Contest (http://okrtty.crk.cz), third full weekend in December,
; Saturday 00:00-24:00 UTC, RTTY on 80/40/20/15/10 m.
; Copy to ~/.config/llog/contests/ok-dx-rtty.ini and adjust the marked lines.
; Needs a country file: save cty.dat from www.country-files.com as
; ~/.config/llog/cty.dat
[contest]
contest = OK-DX-RTTY
; you send RST and your CQ zone (Germany: 14) - adjust if you are elsewhere
exchange_sent = 14
category_operator = SINGLE-OP
; ALL, or 80M / 40M / 20M / 15M / 10M for a single band entry
category_band = ALL
; LOW (up to 100 W) or HIGH
category_power = LOW
category_mode = RTTY
; your locator, for the distance shown in the QSO list (may be empty)
locator =

; log every QSO as RTTY, whatever data mode the radio reports
mode = RTTY

; the rules do not say; once per band is the usual rule
dupe_check = band
dupe_ignore_suffix = no
dupe_exchange = no
dupe_minutes = 0

; 20/15/10 m: 1 point within your continent, 2 points outside (DX)
; 40/80 m:    3 points within your continent, 6 points outside
points = SAME:1, DX:2, 40M+SAME:3, 40M+DX:6, 80M+SAME:3, 80M+DX:6
; multipliers on each band: every DXCC country ...
mult_country = yes
; ... and every OK/OL station (only for entrants outside OK/OL: remove this
; line if you operate from the Czech Republic)
mult_calls = OK
mult_per = band
